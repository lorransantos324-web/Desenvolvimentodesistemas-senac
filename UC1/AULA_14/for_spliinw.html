  <script>
// NOME ARQUIVO SPLITE.HTML


let lista = [
  "CANETA",
  "LÁPIS",
  "BORRACHA",
  "FOLHA",
  "MARCADOR"
];

let Material = Number(prompt("ESCREVA UM CÓDIGO PARA EXCLUIR (0 para sair)"));

while (Material !== 0) {

  if (Material >= 1 && Material <= lista.length) {
    lista.splice(Material - 1, 1);
  } else {
    alert("Código inválido!");
  }

  let print = "LISTA DE MATERIAL\n";

  lista.forEach(function(material, i) {
    print += `${i + 1}. ${material}\n`;
  });

  alert(print);

  Material = Number(prompt("ESCREVA UM CÓDIGO PARA EXCLUIR (0 para sair)"));
}
</script>
